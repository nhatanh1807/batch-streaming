
services:
  postgres:
    image: postgres:16
    container_name: batch-streaming-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: batch_streaming
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

  etl:
    build:
      context: .
      dockerfile: Dockerfile
    image: batch-streaming:latest
    container_name: batch-streaming-etl
    depends_on:
      - postgres
    environment:
      POSTGRES_DB: batch_streaming
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      AWS_PROFILE: ${AWS_PROFILE:-batch-streaming}
      AWS_REGION: ap-southeast-1
      S3_BUCKET: batch-streaming-bronze
      S3_RAW_PREFIX: raw/binance/trades
    volumes:
      - ./data:/app/data
      - spark-events:/opt/spark-events
      - type: bind
        source: ${AWS_HOST_DIR:?Please set AWS_HOST_DIR in .env}
        target: /root/.aws
        read_only: true
      

  pgadmin:
    image: dpage/pgadmin4
    container_name: batch-streaming-pgadmin
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: nhatanhworkacc@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    image: batch-streaming:latest
    container_name: batch-streaming-consumer
    restart: unless-stopped
    environment:
      AWS_PROFILE: ${AWS_PROFILE:-batch-streaming}
      AWS_REGION: ap-southeast-1
      S3_BUCKET: batch-streaming-bronze
      S3_RAW_PREFIX: raw/binance/trades
    volumes:
      - type: bind
        source: ${AWS_HOST_DIR:?Please set AWS_HOST_DIR in .env}
        target: /root/.aws
        read_only: true
    command: ["python", "main_consumer.py"]

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: batch-streaming-airflow:latest
    container_name: batch-streaming-airflow-init
    depends_on:
      - postgres
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ""
    command: db migrate
    restart: "no"

  airflow-webserver:
    user: "0:0"
    image: batch-streaming-airflow:latest
    container_name: batch-streaming-airflow-webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-common-env
      AWS_HOST_DIR: ${AWS_HOST_DIR:?Please set AWS_HOST_DIR in .env}
      AWS_PROFILE: ${AWS_PROFILE:-batch-streaming}
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${AWS_HOST_DIR:?Please set AWS_HOST_DIR in .env}
        target: /root/.aws
        read_only: true
    command: >
      bash -c "airflow users create
      --username admin
      --password admin
      --firstname Airflow
      --lastname Admin
      --role Admin
      --email admin@example.com || true;
      exec airflow webserver"

  airflow-scheduler:
    user: "0:0"
    image: batch-streaming-airflow:latest
    container_name: batch-streaming-airflow-scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-common-env
      AWS_HOST_DIR: ${AWS_HOST_DIR:?Please set AWS_HOST_DIR in .env}
      AWS_PROFILE: ${AWS_PROFILE:-batch-streaming}
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${AWS_HOST_DIR:?Please set AWS_HOST_DIR in .env}
        target: /root/.aws
        read_only: true
    command: scheduler
  spark-history-server:
    image: apache/spark:4.1.2
    container_name: batch-streaming-spark-history
    restart: unless-stopped
    ports:
      - "18080:18080"
    volumes:
      - spark-events:/opt/spark-events
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.history.HistoryServer
    environment:
      SPARK_HISTORY_OPTS: "-Dspark.history.fs.logDirectory=file:/opt/spark-events"
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: batch-streaming-streamlit
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: batch_streaming
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "8501:8501"
volumes:
  postgres_data:
  pgadmin_data:
  airflow_logs:
  spark-events: