services:

  postgres:
    image: postgres:16
    container_name: batch-streaming-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: batch_streaming
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

  etl:
    build:
      context: .
      dockerfile: Dockerfile
    image: batch-streaming:latest
    container_name: batch-streaming-etl
    depends_on:
      - postgres
    environment:
      POSTGRES_DB: batch_streaming
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
    volumes:
      - ./data:/app/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: batch-streaming-pgadmin
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: nhatanhworkacc@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
  
  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    image: batch-streaming:latest
    container_name: batch-streaming-consumer
    volumes:
      - ./data:/app/data
    command: ["python", "main_consumer.py"]

volumes:
  postgres_data:
  pgadmin_data: